<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>省基层任务 · 数据核采原型</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
      background: linear-gradient(160deg, #0b5fff 0%, #1677ff 40%, #e8f3ff 40%, #f5f7fa 100%);
      color: #262626;
      padding: 48px 20px 64px;
    }
    .wrap { max-width: 720px; margin: 0 auto; }
    h1 { color: #fff; font-size: 28px; margin-bottom: 8px; }
    .sub { color: rgba(255,255,255,.85); font-size: 14px; margin-bottom: 32px; line-height: 1.6; }
    .card {
      background: #fff;
      border-radius: 12px;
      padding: 24px;
      margin-bottom: 16px;
      box-shadow: 0 8px 24px rgba(0,0,0,.08);
    }
    .card h2 { font-size: 18px; margin-bottom: 8px; }
    .card p { font-size: 13px; color: #8c8c8c; line-height: 1.6; margin-bottom: 16px; }
    .btn {
      display: inline-block;
      background: #1677ff;
      color: #fff;
      text-decoration: none;
      padding: 10px 20px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 500;
    }
    .btn:hover { background: #0958d9; }
    .btn.secondary { background: #fff; color: #1677ff; border: 1px solid #1677ff; margin-left: 8px; }
    .tip {
      background: #fff7e6;
      border: 1px solid #ffe58f;
      border-radius: 8px;
      padding: 12px 14px;
      font-size: 12px;
      color: #ad6800;
      line-height: 1.6;
    }
    .tip strong { color: #f5222d; }
    footer { margin-top: 24px; font-size: 12px; color: rgba(255,255,255,.7); }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>省基层任务 · 数据核采原型</h1>
    <p class="sub">供产品与研发对照的交互原型。推送 GitHub 后可通过本页实时查看最新版本。</p>

    <div class="card">
      <h2>PC 端原型</h2>
      <p>省基层任务列表、手动下发、辖区任务 / 我的任务、数据管理（应急小单元）、进度统计等。</p>
      <a class="btn" href="./pc/">打开 PC 端</a>
    </div>

    <div class="card">
      <h2>移动端原型</h2>
      <p>我的任务 · 数据核采：任务卡片、数据列表、左滑删除、新增/编辑表单等。</p>
      <a class="btn" href="./mobile/">打开移动端</a>
    </div>

    <div class="tip">
      <strong>开发说明</strong>
      本站由 GitHub Pages 托管。产品更新原型并 <code>git push</code> 后，约 1～2 分钟刷新即可看到最新内容。
      建议研发收藏本入口页，不要只收藏本地文件路径。
    </div>

    <footer>基层智治 · 省基层任务模块原型</footer>
  </div>
</body>
</html>
