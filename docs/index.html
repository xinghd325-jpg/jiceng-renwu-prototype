<!DOCTYPE html>

<!-- jhdx-gate -->
<script>
(function () {
  var KEY = "jhdx_gate_v1";
  var HASH = "31a93a479fcc8b3e53735a68ee6dc35b38452a653a8e9471e1c2b15dedf1d378";
  function sha256(s) {
    if (window.crypto && crypto.subtle && window.TextEncoder) {
      return crypto.subtle.digest("SHA-256", new TextEncoder().encode(s)).then(function (buf) {
        return Array.from(new Uint8Array(buf)).map(function (b) {
          return ("0" + b.toString(16)).slice(-2);
        }).join("");
      });
    }
    return Promise.resolve("");
  }
  function pass() {
    sessionStorage.setItem(KEY, "1");
    var g = document.getElementById("jhdx-gate");
    if (g && g.parentNode) g.parentNode.removeChild(g);
    document.documentElement.style.visibility = "";
  }
  if (sessionStorage.getItem(KEY) === "1") return;
  document.documentElement.style.visibility = "hidden";
  function boot() {
    if (sessionStorage.getItem(KEY) === "1") {
      document.documentElement.style.visibility = "";
      return;
    }
    if (document.getElementById("jhdx-gate")) return;
    var g = document.createElement("div");
    g.id = "jhdx-gate";
    g.innerHTML =
      '<style>#jhdx-gate{position:fixed;inset:0;z-index:2147483647;background:linear-gradient(180deg,#1564e8 0%,#1677FF 42%,#f0f2f5 42%);display:flex;align-items:center;justify-content:center;font-family:-apple-system,"Microsoft YaHei","PingFang SC",sans-serif}#jhdx-gate .box{width:380px;max-width:calc(100vw - 32px);background:#fff;border-radius:10px;padding:28px 24px 24px;box-shadow:0 12px 32px rgba(15,40,80,.18)}#jhdx-gate h2{margin:0 0 8px;font-size:18px;color:rgba(0,0,0,.88)}#jhdx-gate p{margin:0 0 16px;font-size:13px;color:rgba(0,0,0,.55);line-height:1.6}#jhdx-gate input{width:100%;height:36px;border:1px solid #d0d7e2;border-radius:6px;padding:0 12px;font-size:14px;box-sizing:border-box}#jhdx-gate button{margin-top:12px;width:100%;height:36px;border:0;border-radius:6px;background:#1677FF;color:#fff;font-size:14px;font-weight:600;cursor:pointer}#jhdx-gate .err{color:#ff4d4f;font-size:12px;margin-top:8px;min-height:18px}</style>' +
      '<div class="box"><h2>访问验证</h2><p>该原型已加密，请输入访问密码后继续。</p><input type="password" id="jhdx-pass" placeholder="请输入访问密码" autocomplete="current-password"><div class="err" id="jhdx-err"></div><button type="button" id="jhdx-btn">进入</button></div>';
    (document.body || document.documentElement).appendChild(g);
    document.documentElement.style.visibility = "";
    var input = document.getElementById("jhdx-pass");
    var err = document.getElementById("jhdx-err");
    function ok() {
      var v = (input && input.value) || "";
      sha256(v).then(function (h) {
        if (v === "jhdx" || h === HASH) pass();
        else if (err) err.textContent = "密码错误";
      });
    }
    document.getElementById("jhdx-btn").onclick = ok;
    if (input) {
      input.addEventListener("keydown", function (e) {
        if (e.key === "Enter") ok();
      });
      setTimeout(function () { input.focus(); }, 50);
    }
  }
  if (document.body) boot();
  else document.addEventListener("DOMContentLoaded", boot);
})();
</script>
<!-- /jhdx-gate -->
